# SadSha NetGuard — one-click TEST APK build.
#
# How to use:
#   1. Open the repo on GitHub -> Actions tab -> "Build debug APK".
#   2. Click "Run workflow" (or just push to ai-studio).
#   3. Wait ~10-20 min. The APK is in the run's Artifacts as
#      "sadshanetguard-ai-debug-apk".
# The APK is a DEBUG build signed with a throwaway keystore generated
# fresh on every run (never committed, never the Play Store key).
# Real releases go through build-release-aab.yml with Qasim's keystore.

name: Build debug APK

on:
  push:
    branches: [ai-studio]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # The ubuntu runner already ships a full Android SDK. Do NOT use
      # android-actions/setup-android here: its built-in license-accept
      # step runs `sdkmanager --licenses` without piped input and fails
      # with exit code 1. Pipe `yes` ourselves instead.
      - name: Set up Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # NOTE: $GITHUB_PATH only applies to LATER steps, so use the full
          # sdkmanager path in this step.
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Generate throwaway debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass android -keypass android \
            -dname "CN=SadSha Debug, O=SadSha"
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/debug.keystore
          storePassword=android
          keyAlias=debug
          keyPassword=android
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadshanetguard-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
