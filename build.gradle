// Top-level build file for SadSha NetGuard Android Project
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

// NOTE: dependency repositories (google() / mavenCentral()) are declared
// in settings.gradle (FAIL_ON_PROJECT_REPOS), so no allprojects block here.
tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
