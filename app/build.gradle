apply plugin: 'com.android.application'

// Release signing comes from keystore.properties, written by the
// release workflow from GitHub secrets (KEYSTORE_BASE64 /
// KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD). The file is optional:
// local and debug builds work without it; the release signing config
// is only populated when the file exists.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // NOTE: namespace stays the upstream package. R and BuildConfig are
    // generated in the namespace package, and all 26 Java sources live in
    // eu.faircode.netguard and reference R unqualified — namespace
    // 'com.sadsha.netguard' broke every R reference ("package R does not
    // exist"). The install identity is applicationId below, not namespace.
    namespace 'eu.faircode.netguard'
    compileSdk 35

    defaultConfig {
        applicationId "com.sadsha.netguard"
        minSdk 21
        targetSdk 35
        versionCode 202602
        versionName "3.1.0-sadsha"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++14 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        // Used by ServiceExternal / ActivitySettings for the ad-block hosts
        // file download (upstream NetGuard default, unchanged).
        buildConfigField "String", "HOSTS_FILE_URI", "\"https://www.netguard.me/hosts\""
        // No in-app self-update check in the Play Store build; Play handles
        // updates. Kept empty on purpose.
        buildConfigField "String", "GITHUB_LATEST_API", "\"\""
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField "boolean", "PLAY_STORE_RELEASE", "true"
        }
        debug {
            debuggable true
            buildConfigField "boolean", "PLAY_STORE_RELEASE", "false"
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding false
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }
}

dependencies {
    // AndroidX Core & UI
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    // SwipeRefreshLayout + Glide were missing (sources import them, the AI
    // Studio export's build.gradle never listed them). Versions match the
    // working rembghd sadsha-remix build.
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation('com.github.bumptech.glide:glide:4.14.2') {
        exclude group: "com.android.support"
    }
    annotationProcessor 'com.github.bumptech.glide:compiler:4.14.2'

    // NOTE: no AdMob, no Play Billing in the free SadSha v1.
    // All pro features are unlocked for everyone (see IAB.java).
}
